# Participant VMs, created from the workshop snapshot. Run from instructors/scripts:
#   dovm validate dovm/course.yaml
#   dovm create dovm/course.yaml --login-user bioseq --login-password-file pw.txt
# Replace the image placeholder with the snapshot ID that snapshot.sh prints;
# dovm validate rejects the placeholder, so a forgotten edit fails before anything is created.
name: ngs-course-2026
region: nyc3                # must be a region that holds the snapshot
image: 253160818
ssh_keys:
  - "<ssh key id from Digitalocean>"
monitoring: true
project: AMP 2026 NGS bioinformatics bootcamp
roles:
  student:
    size: s-4vcpu-8gb
    hosts: [student01]
